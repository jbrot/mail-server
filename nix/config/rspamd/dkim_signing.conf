# DKIM signing configuration
# /etc/rspamd/local.d/dkim_signing.conf

# Enable DKIM signing
enabled = true;

# Path to DKIM private keys
path = "/data/rspamd/dkim/$domain.$selector.key";

# Default selector
selector = "mail";

# Sign outgoing mail
sign_local = true;
sign_inbound = false;

# Use domain from envelope sender
use_domain = "envelope";
use_esld = false;

# Allow signing for all domains we host
allow_username_mismatch = true;

# Domain-specific settings can be added here
# domain {
#   example.com {
#     selector = "mail";
#     path = "/data/rspamd/dkim/example.com.mail.key";
#   }
# }
