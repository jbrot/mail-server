# OpenSMTPd Configuration
# /etc/smtpd/smtpd.conf

# PKI certificates (managed by ACME)
pki mail.example.com cert "/data/certs/fullchain.pem"
pki mail.example.com key "/data/certs/key.pem"

# Tables for virtual domains and users
table aliases file:/etc/smtpd/aliases
table domains file:/etc/smtpd/domains
table virtuals file:/etc/smtpd/virtuals

# Filters
filter rspamd proc-exec "filter-rspamd"
filter check_rdns phase connect match !rdns disconnect "550 DNS check failed"
filter check_fcrdns phase connect match !fcrdns disconnect "550 FCrDNS check failed"

# Listen on all interfaces
# Port 25 - SMTP (for receiving mail from other servers)
listen on 0.0.0.0 port 25 tls pki mail.example.com \
    filter { check_rdns, check_fcrdns, rspamd }

# Port 465 - SMTPS (implicit TLS, for client submission)
listen on 0.0.0.0 port 465 smtps pki mail.example.com \
    auth filter rspamd

# Port 587 - Submission (STARTTLS, for client submission)
listen on 0.0.0.0 port 587 tls-require pki mail.example.com \
    auth filter rspamd

# Actions
action "local_mail" lmtp localhost:24 virtual <virtuals>
action "outbound" relay

# Matching rules
# Accept mail for our domains
match from any for domain <domains> action "local_mail"

# Allow authenticated users to send mail
match from any auth for any action "outbound"

# Reject everything else is implicit
