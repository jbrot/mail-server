# Dovecot Configuration
# /etc/dovecot/dovecot.conf

# Protocols to serve
protocols = imap lmtp

# Listen addresses
listen = *, ::

# Base directory for mail storage
mail_location = maildir:/data/mail/%d/%n

# SSL/TLS configuration
ssl = required
ssl_cert = </data/certs/fullchain.pem
ssl_key = </data/certs/key.pem
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
ssl_prefer_server_ciphers = yes

# User and group for mail access
mail_uid = 5000
mail_gid = 5000

# First valid UID/GID
first_valid_uid = 5000
first_valid_gid = 5000

# Authentication
auth_mechanisms = plain login

# Password database - using passwd-file
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /etc/dovecot/users
}

# User database
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/data/mail/%d/%n
}

# IMAP specific settings
protocol imap {
  mail_max_userip_connections = 20
}

# LMTP specific settings (for receiving mail from OpenSMTPd)
protocol lmtp {
  postmaster_address = postmaster@example.com
  mail_plugins = $mail_plugins sieve
}

# Services
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    address = 127.0.0.1
    port = 24
  }
}

service auth {
  # Auth socket for other services
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
    group = vmail
  }
}

# Mailbox configuration
namespace inbox {
  inbox = yes

  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox "Sent Messages" {
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# Sieve plugin (for server-side filtering)
plugin {
  sieve = /data/mail/%d/%n/sieve/active.sieve
  sieve_dir = /data/mail/%d/%n/sieve
}

# Logging
log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr
